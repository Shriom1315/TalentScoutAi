[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to your free Python backend (Render/Railway/etc.)
# Replace with your actual free backend URL once deployed on Render
[[redirects]]
  from = "/api/*"
  to = "https://talentscout-api.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
