services:
  - type: web
    name: talentscout-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build && pip install -r requirements.txt"
    startCommand: "uvicorn python_scrapers.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
